<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Cadastro de Pacientes</title>

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>

		<link rel="stylesheet" href="css/style.css" />
	</head>

	<body>
		<div class="container py-5">
			<h1 class="mb-4">Cadastro de Pacientes</h1>

			<!-- Formulário -->
			<form id="form-paciente" class="row g-3 mb-5">

				<div class="col-md-3">
					<label for="nome" class="form-label">Nome</label>
					<input
						type="text"
						class="form-control"
						id="nome"
						required
					/>
				</div>

				<div class="col-md-3">
					<label for="email" class="form-label">E-mail</label>
					<input
						type="email"
						class="form-control"
						id="email"
						required
					/>
				</div>

				<div class="col-md-2">
					<label for="telefone" class="form-label">Telefone</label>
					<input
						type="tel"
						class="form-control"
						id="telefone"
						required
					/>
				</div>

				<div class="col-md-3">
					<label for="nascimento" class="form-label">
						Data de nascimento
					</label>

					<input
						type="date"
						class="form-control"
						id="nascimento"
						required
					/>
				</div>

				<div class="col-md-1 d-flex align-items-end">
					<button type="submit" class="btn btn-primary w-100">
						+
					</button>
				</div>

			</form>


			<!-- Busca -->
			<div class="mb-4">
				<label for="busca" class="form-label">
					Buscar paciente
				</label>

				<input
					type="text"
					id="busca"
					class="form-control"
					placeholder="Digite o nome do paciente"
				/>
			</div>


			<h2 class="h4 mb-2">
				Pacientes cadastrados
			</h2>

			<!-- Contador -->
			<p id="total-pacientes">
				Total de pacientes: 0
			</p>


			<table class="table table-striped">
				<thead>
					<tr>

						<th
							id="ordenar-nome"
							style="cursor: pointer"
						>
							Nome ↕
						</th>

						<th>E-mail</th>

						<th>Telefone</th>

						<th>Data de nascimento</th>

						<th>Idade</th>

						<th>Ações</th>

					</tr>
				</thead>

				<tbody id="tabela-pacientes">
				</tbody>

			</table>

		</div>

		<script src="js/app.js"></script>
	</body>
</html>
